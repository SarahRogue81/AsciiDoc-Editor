name: asciidoc_editor
description: "Adaptive Material 3 AsciiDoc editor for Android 17 phones, foldables, tablets, and Googlebooks."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.0
  cupertino_icons: ^1.0.8
  webview_flutter: ^4.10.0
  webview_flutter_android: ^4.3.0
  dynamic_color: ^1.7.0
  shared_preferences: ^2.3.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/preview/index.html
    - assets/preview/asciidoctor.min.js
    - assets/preview/asciidoctor.css
    - assets/preview/preview_theme.css
